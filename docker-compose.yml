name: 1c-ai-analyst

services:
  app:
    build: .
    image: 1c-ai-analyst:0.8.0
    container_name: 1c-ai-analyst
    ports:
      - "8501:8501"
    # Снимок 1С не смонтирован. Чтобы подключить каталог, верните ключ volumes
    # и раскомментируйте строку (при наличии ./1c_export):
    # - ./1c_export:/app/1c_export:ro
    environment:
      # values are taken from the shell or from .env (docker compose reads it
      # for interpolation); без ключа приложение работает в офлайн-режиме.
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      # RATE_LIMIT_ALLOW_RESET: "1"   # опционально: кнопка сброса лимита сессии
      RATE_LIMIT_ALLOW_RESET: ${RATE_LIMIT_ALLOW_RESET:-}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
